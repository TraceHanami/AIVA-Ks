version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: aiva
      POSTGRES_PASSWORD: aiva
      POSTGRES_DB: aivaks
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema:/docker-entrypoint-initdb.d

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["29092:29092"]

  neo4j:
    image: neo4j:5.23
    environment:
      NEO4J_AUTH: neo4j/aivapassword
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4jdata:/data

  backend:
    build:
      context: ../backend
    environment:
      AIVA_DATABASE_URL: postgresql+asyncpg://aiva:aiva@postgres:5432/aivaks
      AIVA_JWT_SECRET: dev-only-secret-change-me
    depends_on: [postgres, kafka]
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  feature-extraction:
    build:
      context: ..
      dockerfile: ai/feature_extraction/Dockerfile
    depends_on: [kafka]
    environment:
      KAFKA_BROKERS: kafka:9092

  frontend:
    build:
      context: ../frontend
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  neo4jdata:
