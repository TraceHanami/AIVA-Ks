name: CI Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test-and-lint:
    name: Python ${{ matrix.python-version }} Lint & Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[dev,backend]

      - name: Python Syntax & Compilation Check
        run: |
          make lint

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest tests/ -v --cov=chronos --cov=ai --cov-report=xml --cov-report=term

      - name: Upload Test Coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Verify End-to-End Pipeline Demo
        run: |
          python demo_full_pipeline.py

      - name: Verify Attack Graph Demo
        run: |
          python demo_run.py

  frontend-test-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Run Frontend Linter (oxlint)
        run: |
          npm run lint

      - name: Typecheck & Build Frontend
        run: |
          npm run build

      - name: Upload Frontend Production Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-verification:
    name: Docker & Compose Verification
    runs-on: ubuntu-latest
    needs: [python-test-and-lint, frontend-test-and-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker/docker-compose.yml config

      - name: Build Root Dockerfile (API Engine)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aiva-ks-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aiva-ks-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Feature Extraction Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ai/feature_extraction/Dockerfile
          push: false
          tags: aiva-ks-feature-extraction:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
