[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiva-ks"
version = "0.1.0"
description = "AI-Powered Intelligent Kernel Security Visualizer — Behavioral Graph & Attack Intent Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "AIVA-KS Core Team" }
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.9.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
backend = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
]

[project.scripts]
chronos = "chronos.cli.main:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chronos*", "ai*", "backend*", "response-engine*"]
